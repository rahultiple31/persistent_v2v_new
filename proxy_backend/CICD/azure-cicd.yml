name: v2v-proxy-$(Date:yyyyMMdd)-$(Rev:r)

parameters:
  - name: targetEnvironment
    displayName: Target environment
    type: string
    default: dev
    values: [dev, dev-nsso]
  - name: terraformAction
    displayName: Terraform action
    type: string
    default: plan
    values: [plan, apply]

trigger:
  batch: true
  branches:
    include: [main]
  paths:
    include:
      - proxy_backend/**
      - modules/ecs_proxy/**
      - modules/iam_proxy/**
      - scripts/**
pr: none

variables:
  awsRegion: us-east-1
  terraformVersion: '1.10.5'
  backendBucket: bts-cloud-terraform-tfstate
  backendKey: terraform-state/${{ parameters.targetEnvironment }}/us-east-1/proxy/terraform.tfstate
  planArtifactName: proxy-plan-${{ parameters.targetEnvironment }}-us-east-1
  imageTag: $(Build.SourceVersion)-$(Build.BuildId)

stages:
  - stage: plan
    jobs:
      - job: build_and_plan
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)
          - script: |
              set -euo pipefail
              npm ci --no-audit --no-fund
              npm test
            displayName: Test Nova proxy
            workingDirectory: $(Build.SourcesDirectory)/proxy_backend
          - script: |
              set -euo pipefail
              source "$(Build.SourcesDirectory)/scripts/aws-oidc.sh"
              terraform init -reconfigure \
                -backend-config="bucket=$(backendBucket)" \
                -backend-config="key=$(backendKey)" \
                -backend-config="region=$(awsRegion)" \
                -backend-config="encrypt=true"
              terraform validate
              terraform test
              settings="$(terraform output -json regional_proxy)"
              repository="$(jq -er '.["us-east-1"].ecr_repository_url' <<< "$settings")"
              registry="${repository%%/*}"
              image="$repository:$(imageTag)"
              aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
              docker buildx create --name v2v-builder --use
              docker buildx build --platform linux/arm64 \
                --file "$(Build.SourcesDirectory)/proxy_backend/CICD/Dockerfile" \
                --tag "$image" --push "$(Build.SourcesDirectory)/proxy_backend"
              terraform plan -var='enabled_modules=["proxy"]' \
                -var='proxy_runtime_enabled=true' -var="proxy_container_image=$image" -out=tfplan
              mkdir -p "$(Build.ArtifactStagingDirectory)/proxy-plan"
              cp tfplan "$(Build.ArtifactStagingDirectory)/proxy-plan/"
              cp .terraform.lock.hcl "$(Build.ArtifactStagingDirectory)/proxy-plan/"
            displayName: Build ARM64 image and plan proxy activation
            workingDirectory: $(Build.SourcesDirectory)/environments/${{ parameters.targetEnvironment }}
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
              AWS_OIDC_ROLE_ARN: $(AWS_DEV_OIDC_ROLE_ARN)
              AWS_REGION: $(awsRegion)
              TF_VAR_state_bucket: $(backendBucket)
          - publish: $(Build.ArtifactStagingDirectory)/proxy-plan
            artifact: $(planArtifactName)

  - stage: apply
    dependsOn: plan
    condition: and(succeeded(), eq('${{ parameters.terraformAction }}', 'apply'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: activate_proxy
        environment: ${{ parameters.targetEnvironment }}
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: $(terraformVersion)
                - download: current
                  artifact: $(planArtifactName)
                - script: |
                    set -euo pipefail
                    source "$(Build.SourcesDirectory)/scripts/aws-oidc.sh"
                    cp "$(Pipeline.Workspace)/$(planArtifactName)/.terraform.lock.hcl" .
                    terraform init -reconfigure \
                      -backend-config="bucket=$(backendBucket)" \
                      -backend-config="key=$(backendKey)" \
                      -backend-config="region=$(awsRegion)" \
                      -backend-config="encrypt=true"
                    terraform apply -auto-approve "$(Pipeline.Workspace)/$(planArtifactName)/tfplan"
                  displayName: Activate Nova proxy and wait for healthy ECS service
                  workingDirectory: $(Build.SourcesDirectory)/environments/${{ parameters.targetEnvironment }}
                  env:
                    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                    SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
                    AWS_OIDC_ROLE_ARN: $(AWS_DEV_OIDC_ROLE_ARN)
                    AWS_REGION: $(awsRegion)
                    TF_VAR_state_bucket: $(backendBucket)


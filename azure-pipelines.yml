trigger: none

pr: none

parameters:
  - name: targetEnvironment
    displayName: Target environment
    type: string
    default: dev
    values:
      - dev
      - dev-nsso

  - name: targetModule
    displayName: Target module
    type: string
    default: connect
    values:
      - connect
      - connect-queue
      - Connect_integrations
      - data_table
      - agentcore_gateway
      - lambda
      - proxy
      - v2v
      - s3_connect_reporting
      - lambda-ctr-survey
      - lambda-connect-daily-ctr-export
      - lambda-ctr-raw
      - iam-ctr
      - lambda-snow-btsgsd-dev
      - lambda-servicenow-interaction
      - lambda-nextthink-handoff
      - secrets_manager
      - dynamodb
      - cloudwatch_log_group
      - btsgsd-intent-kb
      - lex_bot
      - ai_agent_tools
      - delete-BTSGSD-SSO-US-AI-Survey-Agent
      - silence_guard-dev
      - UpdateSessionAttributes-dev
      - conversionOfQueueMetrics-dev
      - BTSGSD-lex-yesNo-dev
      - BTSGSD-lex-QueueFlow-Callback-dev

  - name: terraformAction
    displayName: Terraform action
    type: string
    default: plan
    values:
      - plan
      - apply

variables:
  terraformVersion: '1.10.5'
  nodeVersion: '22.x'
  deploymentRegion: 'us-east-1'
  workingDirectory: 'environments/${{ parameters.targetEnvironment }}'
  backendBucket: 'bts-cloud-terraform-tfstate'
  backendRegion: 'us-east-1'
  planArtifactName: 'terraform-plan-${{ parameters.targetEnvironment }}-us-east-1-${{ parameters.targetModule }}'

stages:
  - stage: plan
    displayName: Plan ${{ parameters.targetEnvironment }} us-east-1 ${{ parameters.targetModule }}
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
    jobs:
      - job: terraform_plan
        displayName: Terraform Plan ${{ parameters.targetEnvironment }} us-east-1 ${{ parameters.targetModule }}
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - bash: |
              set -euo pipefail

              for package_dir in \
                "metadata/BTSGSD-lex-yesNo-dev_lambda-dev_lambda" \
                "metadata/conversionOfQueueMetrics-dev_lambda"
              do
                test -f "$package_dir/lambda_function.py"

                python3 -m zipfile -c \
                  "$package_dir/lambda_function.zip" \
                  "$package_dir/lambda_function.py"

                artifact_dir="$(Build.ArtifactStagingDirectory)/terraform-plan/$package_dir"
                mkdir -p "$artifact_dir"
                cp "$package_dir/lambda_function.zip" "$artifact_dir/"
              done
            displayName: Build and preserve Lambda ZIP packages
            workingDirectory: $(workingDirectory)
            condition: and(succeeded(), eq('${{ parameters.targetEnvironment }}', 'dev'))

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: $(terraformVersion)

          - task: NodeTool@0
            displayName: Install Node.js
            condition: eq('${{ parameters.targetModule }}', 'v2v')
            inputs:
              versionSpec: $(nodeVersion)

          - script: |
              set -euo pipefail

              source "$(Build.SourcesDirectory)/scripts/terraform-target.sh" \
                '${{ parameters.targetModule }}' \
                '${{ parameters.targetEnvironment }}' \
                '$(deploymentRegion)'

              echo "Checked-out source commit: $(git rev-parse HEAD)"
              echo "Pipeline source commit: $BUILD_SOURCEVERSION"

              case '${{ parameters.targetEnvironment }}' in
                dev|dev-nsso)
                  AWS_ROLE_ARN='$(AWS_DEV_OIDC_ROLE_ARN)'
                  ;;
              esac

              if [ -z "$AWS_ROLE_ARN" ] || [[ "$AWS_ROLE_ARN" == \$\(* ]]; then
                echo "AWS OIDC role ARN is not configured for ${{ parameters.targetEnvironment }}."
                exit 1
              fi

              OIDC_RESPONSE="$(curl -sS \
                -X POST \
                -H "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" \
                -H "Content-Length: 0" \
                "${SYSTEM_OIDCREQUESTURI}?api-version=7.1-preview.1")"
              OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | python3 -c 'import json, sys; print(json.load(sys.stdin)["oidcToken"])')"
              AWS_WEB_IDENTITY_TOKEN_FILE="$(Agent.TempDirectory)/aws-oidc-token"
              printf '%s' "$OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"

              export AWS_ROLE_ARN
              export AWS_WEB_IDENTITY_TOKEN_FILE
              export AWS_ROLE_SESSION_NAME="azure-pipelines-${{ parameters.targetEnvironment }}-$(Build.BuildId)"
              export AWS_REGION='$(deploymentRegion)'
              export AWS_DEFAULT_REGION='$(deploymentRegion)'

              if [ '${{ parameters.targetModule }}' = 'v2v' ]; then
                npm ci --prefix "$(Build.SourcesDirectory)/webapp" --no-audit --no-fund
                npm run build --prefix "$(Build.SourcesDirectory)/webapp"
              fi

              terraform init -reconfigure \
                -backend-config="bucket=$(backendBucket)" \
                -backend-config="key=$TERRAFORM_BACKEND_KEY" \
                -backend-config="region=$(backendRegion)" \
                -backend-config="encrypt=true"

              if [ '${{ parameters.targetModule }}' = 'proxy' ]; then
                source "$(Build.SourcesDirectory)/scripts/preserve-proxy-runtime.sh"
              fi

              terraform fmt -check -recursive ../..
              terraform validate
              python3 -m pip install --upgrade pip
              python3 -m pip install checkov
              checkov -d ../.. --framework terraform --soft-fail
              preserve_terraform_target_outputs
              terraform plan "${TERRAFORM_PLAN_ARGS[@]}" -out=tfplan
              validate_terraform_target_plan tfplan

              PLAN_ARTIFACT_DIR="$(Build.ArtifactStagingDirectory)/terraform-plan"
              mkdir -p "$PLAN_ARTIFACT_DIR"
              cp tfplan "$PLAN_ARTIFACT_DIR/"
              cp .terraform.lock.hcl "$PLAN_ARTIFACT_DIR/"
              find . -maxdepth 1 -name '*.zip' -exec cp {} "$PLAN_ARTIFACT_DIR/" \;
              if [ '${{ parameters.targetModule }}' = 'v2v' ]; then
                mkdir -p "$PLAN_ARTIFACT_DIR/v2v-dist"
                cp -R "$(Build.SourcesDirectory)/webapp/dist/." "$PLAN_ARTIFACT_DIR/v2v-dist/"
              fi
            displayName: Terraform Init, Validate, and Plan
            workingDirectory: $(workingDirectory)
            env:
              TF_VAR_state_bucket: $(backendBucket)
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)

          - publish: $(Build.ArtifactStagingDirectory)/terraform-plan
            displayName: Publish Plan
            artifact: $(planArtifactName)

  - stage: apply
    displayName: Apply ${{ parameters.terraformAction }} ${{ parameters.targetEnvironment }} us-east-1 ${{ parameters.targetModule }}
    dependsOn: plan
    condition: and(succeeded(), eq('${{ parameters.terraformAction }}', 'apply'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: terraform_apply
        displayName: Terraform Apply ${{ parameters.terraformAction }} ${{ parameters.targetEnvironment }} us-east-1 ${{ parameters.targetModule }}
        environment: ${{ parameters.targetEnvironment }}
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  displayName: Install Terraform
                  inputs:
                    terraformVersion: $(terraformVersion)

                - download: current
                  displayName: Download Plan
                  artifact: $(planArtifactName)

                - bash: |
                    set -euo pipefail

                    for package_dir in \
                      "metadata/BTSGSD-lex-yesNo-dev_lambda-dev_lambda" \
                      "metadata/conversionOfQueueMetrics-dev_lambda"
                    do
                      artifact_zip="$(Pipeline.Workspace)/$(planArtifactName)/$package_dir/lambda_function.zip"

                      test -f "$artifact_zip"
                      mkdir -p "$package_dir"
                      cp "$artifact_zip" "$package_dir/lambda_function.zip"
                    done
                  displayName: Restore planned Lambda ZIP packages
                  workingDirectory: $(workingDirectory)
                  condition: and(succeeded(), eq('${{ parameters.targetEnvironment }}', 'dev'))

                - script: |
                    set -euo pipefail

                    case '${{ parameters.targetEnvironment }}' in
                      dev|dev-nsso)
                        AWS_ROLE_ARN='$(AWS_DEV_OIDC_ROLE_ARN)'
                        ;;
                    esac

                    if [ -z "$AWS_ROLE_ARN" ] || [[ "$AWS_ROLE_ARN" == \$\(* ]]; then
                      echo "AWS OIDC role ARN is not configured for ${{ parameters.targetEnvironment }}."
                      exit 1
                    fi

                    OIDC_RESPONSE="$(curl -sS \
                      -X POST \
                      -H "Authorization: Bearer ${SYSTEM_ACCESSTOKEN}" \
                      -H "Content-Length: 0" \
                      "${SYSTEM_OIDCREQUESTURI}?api-version=7.1-preview.1")"
                    OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | python3 -c 'import json, sys; print(json.load(sys.stdin)["oidcToken"])')"
                    AWS_WEB_IDENTITY_TOKEN_FILE="$(Agent.TempDirectory)/aws-oidc-token"
                    printf '%s' "$OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"

                    export AWS_ROLE_ARN
                    export AWS_WEB_IDENTITY_TOKEN_FILE
                    export AWS_ROLE_SESSION_NAME="azure-pipelines-${{ parameters.targetEnvironment }}-$(Build.BuildId)"
                    export AWS_REGION='$(deploymentRegion)'
                    export AWS_DEFAULT_REGION='$(deploymentRegion)'

                    if [ '${{ parameters.targetModule }}' = 'v2v' ]; then
                      V2V_DIST_DIR="$(Build.SourcesDirectory)/webapp/dist"
                      rm -rf "$V2V_DIST_DIR"
                      mkdir -p "$V2V_DIST_DIR"
                      cp -R "$(Pipeline.Workspace)/$(planArtifactName)/v2v-dist/." "$V2V_DIST_DIR/"
                    fi

                    source "$(Build.SourcesDirectory)/scripts/terraform-target.sh" \
                      '${{ parameters.targetModule }}' \
                      '${{ parameters.targetEnvironment }}' \
                      '$(deploymentRegion)'

                    cp "$(Pipeline.Workspace)/$(planArtifactName)/.terraform.lock.hcl" .
                    terraform init -reconfigure \
                      -backend-config="bucket=$(backendBucket)" \
                      -backend-config="key=$TERRAFORM_BACKEND_KEY" \
                      -backend-config="region=$(backendRegion)" \
                      -backend-config="encrypt=true"

                    find "$(Pipeline.Workspace)/$(planArtifactName)" -maxdepth 1 -name '*.zip' -exec cp {} . \;
                    terraform apply -auto-approve "$(Pipeline.Workspace)/$(planArtifactName)/tfplan"

                    if [ '${{ parameters.targetModule }}' = 'v2v' ]; then
                      bash "$(Build.SourcesDirectory)/scripts/deploy-webapp.sh" "$(Build.SourcesDirectory)/webapp/dist"
                    fi
                  displayName: Terraform Apply
                  workingDirectory: $(workingDirectory)
                  env:
                    TF_VAR_state_bucket: $(backendBucket)
                    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                    SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)

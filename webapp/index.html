<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="./lib/connect-rtc-1.1.26.min.js"></script>
  <script src="./frontend-config.js" type="text/javascript"></script>
  <title>Amazon Connect V2V</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div id="app">
    <header>
      <div class="brand-block">
        <div class="logo-block">
          <img src="./assets/abbvie-logo.svg" alt="AbbVie Logo" class="abbvie-logo" />
        </div>
        <h5>Amazon Connect V2V</h5>
      </div>

      <!-- Language Configuration — moved to header -->
      <!-- COMMENTED OUT: moved individual language selects into Customer/Agent sections
        <div id="divLanguageConfig" class="header-lang-block">
          <div class="language-config-card">
            <div class="language-config-row">
              <div class="language-config-item">
                <label for="customerLanguagePicker">&#127909; Customer Language</label>
                <select id="customerLanguagePicker">
                  <option value="">-- Select Language --</option>
                </select>
              </div>
              <div class="language-config-arrow">&#8644;</div>
              <div class="language-config-item">
                <label for="agentLanguagePicker">&#127897; Agent Language</label>
                <select id="agentLanguagePicker">
                  <option value="">-- Select Language --</option>
                </select>
              </div>
              <button id="applyLanguageButton" class="apply-lang-btn">&#10003; Apply</button>
            </div>
            <div id="languageStatusRow" class="language-status-row hidden">
              <span class="lang-status-badge customer-badge">
                <span class="lang-status-icon">&#127909;</span>
                <span id="customerLangBadgeName"></span>
                <span id="customerLangBadgeVoice" class="lang-status-voice"></span>
              </span>
              <span class="lang-status-arrow">&#10230; translated &#10230;</span>
              <span class="lang-status-badge agent-badge">
                <span class="lang-status-icon">&#127897;</span>
                <span id="agentLangBadgeName"></span>
                <span id="agentLangBadgeVoice" class="lang-status-voice"></span>
              </span>
            </div>
          </div>
        </div>
        -->

      <div class="header-actions">

        <!-- 2. Service Now (redirection to be wired later) -->
        <!-- <span class="header-servicenow" id="serviceNowLink" title="Service Now">
           <i class="bi bi-ticket-detailed-fill"></i>
        </span> -->

        <!-- 3. Notification Bell -->
        <button id="notificationBellButton" class="notification-bell" aria-label="Notifications">
          <span class="bell-symbol"><i class="bi bi-bell"></i></span>
          <span id="notificationBadge" class="notification-badge hidden">0</span>
        </button>

        <!-- 4. User Profile -->
        <div class="user-profile-wrapper">
          <button id="userProfileButton" class="user-profile-btn" aria-label="User Profile">
            <i class="bi bi-person-circle"></i>
          </button>
          <div id="userProfileDropdown" class="user-profile-dropdown hidden">
            <button id="logoutButton"> Logout</button>
          </div>
        </div>

      </div>
      <div id="notificationDropdown" class="notification-dropdown hidden" aria-label="Notifications panel"></div>
    </header>

    <main>
      <div id="leftColumn">

        <div id="ccpSidePanel" class="ccp-side-panel">

          <section id="ccpSection">
            <h6><!-- &#128222; --> <i class="bi bi-telephone-fill" style="color: #3498db;"></i> Contact Control Panel
            </h6>
            <div id="ccpContainer"></div>
          </section>


          <section id="audioControls">
            <h6>
              <span><i class="bi bi-headphones margin-right-5"></i> Audio Controls</span>
              <!-- Filled caret toggles collapse — Bootstrap adds .collapsed when panel is hidden -->
              <button class="audio-collapse-btn collapsed" type="button" data-bs-toggle="collapse"
                data-bs-target="#audioControlsBody" aria-expanded="false" aria-controls="audioControlsBody"
                title="Toggle Audio Controls">
                <i class="bi bi-caret-up-fill audio-collapse-icon"></i>
              </button>
            </h6>
            <div id="audioControlsBody" class="collapse">
              <!-- Settings gear button moved here: top-right of the expanded body -->
              <!-- <div class="audio-settings-bar">
                <div class="audio-settings-anchor">
                  <button id="audioSettingsBtn" class="panel-settings-btn" data-popup="audioSettingsPopup"
                    title="Audio Settings"><i class="bi bi-gear"></i></button>
                  <div id="audioSettingsPopup" class="panel-settings-popup">
                    <div class="popup-arrow"></div>
                    <p class="popup-title"><i class="bi bi-gear"></i> Audio Settings</p>
                    <div class="checkbox-group">
                      <input type="checkbox" id="echoCancellationCheckbox" name="echoCancellationCheckbox" checked />
                      <label for="echoCancellationCheckbox">Echo Cancellation</label>
                    </div>
                    <div class="checkbox-group">
                      <input type="checkbox" id="noiseSuppressionCheckbox" name="noiseSuppressionCheckbox" checked />
                      <label for="noiseSuppressionCheckbox">Noise Suppression</label>
                    </div>
                    <div class="checkbox-group">
                      <input type="checkbox" id="autoGainControlCheckbox" name="autoGainControlCheckbox" checked />
                      <label for="autoGainControlCheckbox">Auto Gain Control</label>
                    </div>
                  </div>
                </div>
              </div> -->
              <div class="control-group">
                <div class="audio-settings-bar">
                  <div class="audio-settings-anchor">
                    <button id="audioSettingsBtn" class="panel-settings-btn" data-popup="audioSettingsPopup"
                      title="Audio Settings"><i class="bi bi-gear"></i></button>
                    <div id="audioSettingsPopup" class="panel-settings-popup">
                      <div class="popup-arrow"></div>
                      <p class="popup-title"><i class="bi bi-gear"></i> Audio Settings</p>
                      <div class="checkbox-group">
                        <input type="checkbox" id="echoCancellationCheckbox" name="echoCancellationCheckbox" checked />
                        <label for="echoCancellationCheckbox">Echo Cancellation</label>
                      </div>
                      <div class="checkbox-group">
                        <input type="checkbox" id="noiseSuppressionCheckbox" name="noiseSuppressionCheckbox" checked />
                        <label for="noiseSuppressionCheckbox">Noise Suppression</label>
                      </div>
                      <div class="checkbox-group">
                        <input type="checkbox" id="autoGainControlCheckbox" name="autoGainControlCheckbox" checked />
                        <label for="autoGainControlCheckbox">Auto Gain Control</label>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="audio-device-group">
                  <label for="speakerSelect">Speaker:</label>
                  <div class="audio-device-row">
                    <select id="speakerSelect">
                      <option value="">-- Select Speaker --</option>
                    </select>
                    <button id="testAudioButton" title="Test">Test</button>
                    <button id="speakerSaveButton" title="Save">Save</button>
                  </div>
                </div>
                <div class="audio-device-group">
                  <label for="micSelect">Microphone:</label>
                  <div class="audio-device-row">
                    <select id="micSelect">
                      <option value="">-- Select Microphone --</option>
                    </select>
                    <button id="testMicButton" title="Test">Test</button>
                    <button id="micSaveButton" title="Save">Save</button>
                  </div>
                </div>
                <div id="volumeBarContainer" class="volume-bar-container">
                  <div id="volumeBar" class="volume-bar"></div>
                </div>
              </div>
            </div>
          </section>


          <section id="audioPlayback" style="display:none" aria-hidden="true">
            <audio id="remote-audio" autoplay></audio>
            <audio id="toCustomerAudioElement" autoplay muted></audio>
            <audio id="toAgentAudioElement" autoplay></audio>
          </section>

        </div><!-- /ccpSidePanel -->
      </div>

      <div id="rightColumn">
        <section id="transcribeTranslate">
          <!-- ═══ Left Panel (Customer Info Row + Participants Row) | Transcription ═══ -->

          <div id="divLeftPanel">

            <!-- Row 1: Customer Information -->
            <div id="divCustomerInformation" class="participant-controls">
              <h6>
                <span><i class="bi bi-person-lines-fill margin-right-5"></i>Customer Information</span>
              </h6>
              <div class="customer-info-scroll-wrapper">
                <button class="ci-scroll-arrow ci-scroll-left" id="ciScrollLeft" aria-label="Scroll left">
                  <i class="bi bi-chevron-left"></i>
                </button>
                <div class="customer-info-body" id="customerInfoBody">
                  <div class="customer-info-grid">
                    <!-- Column 1: fields 1–5 -->
                    <div class="customer-info-col">
                      <div class="customer-info-item">
                        <span class="ci-key">User ID</span>
                        <span class="ci-value" id="ciUserId">—</span>
                      </div>
                      <div class="customer-info-item">
                        <span class="ci-key">Caller Name</span>
                        <span class="ci-value" id="ciCallerName">—</span>
                      </div>
                      <div class="customer-info-item">
                        <span class="ci-key">Verification Status</span>
                        <span class="ci-value" id="ciVerificationStatus">—</span>
                      </div>
                      <div class="customer-info-item">
                        <span class="ci-key">Verified Via</span>
                        <span class="ci-value" id="ciVerifiedVia">—</span>
                      </div>

                      <div class="customer-info-item">
                        <span class="ci-key">UPI</span>
                        <span class="ci-value" id="ciUPI">—</span>
                      </div>

                    </div>
                    <!-- Column 2: fields 6–9 + 1 empty placeholder -->
                    <div class="customer-info-col">
                      <div class="customer-info-item">
                        <span class="ci-key">Hired Status</span>
                        <span class="ci-value" id="ciHiredStatus">—</span>
                      </div>
                      <div class="customer-info-item">
                        <span class="ci-key">Intent</span>
                        <span class="ci-value" id="ciIntent">—</span>
                      </div>
                      <div class="customer-info-item">
                        <span class="ci-key">Queue</span>
                        <span class="ci-value" id="ciQueue">—</span>
                      </div>
                      <div class="customer-info-item">
                        <span class="ci-key">Dialed Number</span>
                        <span class="ci-value" id="ciDialedNumber">—</span>
                      </div>
                      <div class="customer-info-item ci-empty"></div>
                    </div>
                  </div>
                </div>
                <button class="ci-scroll-arrow ci-scroll-right" id="ciScrollRight" aria-label="Scroll right">
                  <i class="bi bi-chevron-right"></i>
                </button>
              </div>
            </div>

            <!-- Row 2: Customer + Agent side by side -->
            <div id="divParticipantRow">

              <div id="divCustomerControls" class="participant-controls">
                <h6>
                  <span><!-- &#127909; --> <i class="bi bi-telephone-inbound margin-right-5"></i>Customer</span>
                  <button class="panel-settings-btn" data-popup="customerSettingsPopup"
                    title="Customer stream settings"><i class="bi bi-gear"></i></button>
                </h6>


                <!-- Customer settings popup -->
                <div id="customerSettingsPopup" class="panel-settings-popup">
                  <div class="popup-arrow"></div>
                  <p class="popup-title"><!-- &#127909; --><i class="bi bi-telephone-inbound margin-right-5"></i>
                    Customer
                    Settings</p>
                  <div class="checkbox-group">
                    <input type="checkbox" id="customerStreamMicCheckbox" name="customerStreamMicCheckbox" />
                    <label for="customerStreamMicCheckbox">Stream mic to agent</label>
                  </div>
                  <div class="checkbox-group">
                    <input type="checkbox" id="customerStreamTranslationCheckbox"
                      name="customerStreamTranslationCheckbox" />
                    <label for="customerStreamTranslationCheckbox">Stream translation to customer</label>
                  </div>
                  <div class="checkbox-group">
                    <input type="checkbox" id="customerAudioFeedbackEnabledCheckbox"
                      name="customerAudioFeedbackEnabledCheckbox" checked />
                    <label for="customerAudioFeedbackEnabledCheckbox">Enable audio feedback</label>
                  </div>
                </div>
                <div class="control-group-transcribe">
                  <!-- ═══ REQ 1: Customer transcription buttons are HIDDEN ═══════════════════════
                       Customer transcription is now started/stopped by the Agent section buttons.
                       The button elements are kept in the DOM (inside the hidden div at the bottom
                       of <body>) so that all existing JS references remain valid.
                  ══════════════════════════════════════════════════════════════════════════════ -->
                  <div class="button-group" style="min-height: 25px;" aria-hidden="true">
                    <!-- Customer buttons commented out — controlled by Agent Start/Stop -->
                  </div>
                  <div class="language-select-group">
                    <label for="customerTranslateFromLanguageSelect">Language:</label>
                    <select id="customerTranslateFromLanguageSelect">
                      <option value="">-- Select Language --</option>
                    </select>
                  </div>
                  <div class="output-group">
                    <label>Customer said:</label>
                    <div id="customerTranscriptionTextOutputDiv" class="output-text"></div>
                  </div>
                  <div class="output-group">
                    <label>Translated to agent:</label>
                    <div id="customerTranslatedTextOutputDiv" class="output-text"></div>
                  </div>

                </div>
              </div>

              <div id="divAgentControls" class="participant-controls">
                <h6>
                  <!-- <span>&#127897; Agent</span> -->
                  <span><i class="bi bi-headset margin-right-5"></i>Agent</span>
                  <button class="panel-settings-btn" data-popup="agentSettingsPopup" title="Agent stream settings"><i
                      class="bi bi-gear"></i></button>
                </h6>
                <!-- Agent settings popup -->
                <div id="agentSettingsPopup" class="panel-settings-popup">
                  <div class="popup-arrow"></div>
                  <p class="popup-title"><!-- &#127897; --> <i class="bi bi-headset margin-right-5"></i>Agent Settings
                  </p>
                  <div class="volume-group">
                    <label for="agentStreamMicVolume">Volume:</label>
                    <input type="range" id="agentStreamMicVolume" min="0" max="1" step="0.05" value="0.8" />
                  </div>
                  <div class="checkbox-group">
                    <input type="checkbox" id="agentStreamTranslationCheckbox" name="StreamTranslationCheckbox" />
                    <label for="agentStreamTranslationCheckbox">Stream translation to agent</label>
                  </div>
                  <div class="checkbox-group">
                    <input type="checkbox" id="agentStreamMicCheckbox" name="agentStreamMicCheckbox" />
                    <label for="agentStreamMicCheckbox">Stream mic to customer</label>
                  </div>
                  <div class="checkbox-group">
                    <input type="checkbox" id="agentAudioFeedbackEnabledCheckbox"
                      name="agentAudioFeedbackEnabledCheckbox" checked />
                    <label for="agentAudioFeedbackEnabledCheckbox">Enable audio feedback</label>
                  </div>
                </div>
                <div class="control-group-transcribe">
                  <div class="button-group">
                    <button id="agentStartTranscriptionButton" title="Start Transcription" disabled><!-- &#9654; --> <i
                        class="bi bi-caret-right-fill margin-right-5"></i>Start</button>
                    <button id="agentLoadingTranscriptionButton" title="Starting Transcription" disabled
                      style="display:none"><span class="btn-spinner"></span> Starting...</button>
                    <button id="agentStopTranscriptionButton" title="Stop Transcription" disabled
                      style="display:none"><!-- &#9646;&#9646;  --><i class="bi bi-stop-fill"></i>Stop</button>
                  </div>
                  <div class="language-select-group">
                    <label for="agentTranslateFromLanguageSelect">Language:</label>
                    <select id="agentTranslateFromLanguageSelect">
                      <option value="">-- Select Language --</option>
                    </select>
                  </div>
                  <div class="output-group">
                    <label>Agent said:</label>
                    <div id="agentTranscriptionTextOutputDiv" class="output-text"></div>
                  </div>
                  <div class="output-group">
                    <label>Translated to customer:</label>
                    <div id="agentTranslatedTextOutputDiv" class="output-text"></div>
                  </div>

                  <!-- Additional Features collapsible toggle -->
                  <div class="agent-additional-features-toggle">
                    <button class="agent-additional-btn collapsed" type="button" data-bs-toggle="collapse"
                      data-bs-target="#agentAdditionalFeaturesBody" aria-expanded="false"
                      aria-controls="agentAdditionalFeaturesBody" title="Additional Features">
                      <i class="bi bi-caret-up-fill agent-additional-icon"></i>
                    </button>
                  </div>
                  <div id="agentAdditionalFeaturesBody" class="collapse">
                    <div class="input-group-custom" style="margin-top:8px">
                      <input type="text" id="agentTranslateTextInput" placeholder="Type to translate &amp; speak" />
                      <button id="agentTranslateTextButton"><!-- &#9658; --> <i
                          class="bi bi-send-fill margin-right-5"></i>Send</button>
                    </div>
                    <div class="input-group-custom">
                      <input type="text" id="agentPollyTextInput" placeholder="Type for Polly synthesis" />
                      <button id="agentSynthesizeSpeechButton"><!-- &#128266; --><i
                          class="bi bi-megaphone margin-right-5"></i>
                        Speak</button>
                    </div>
                  </div>

                </div>
              </div><!-- /divParticipantRow -->

            </div>


          </div>
          <div id="divTranscription" class="participant-controls">
            <h6>
              <span><i class="bi bi-chat-dots"></i> Transcription</span>
              <span class="transcription-latency"><i class="bi bi-lightning"></i> Latency: <span
                  id="latencyValue">--</span> ms</span>
            </h6>
            <div class="control-group-transcription">
              <div id="divTranscriptContainer" class="transcript-container">
                <div class="transcript-spacer"></div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <!-- Hidden stream controls — kept in DOM so JS listeners don't crash -->
  <div style="display:none" aria-hidden="true">
    <button id="btnStreamFile">Stream File</button>
    <button id="btnStreamMic">Stream Mic</button>
    <button id="btnRemoveAudioStream">Remove Stream</button>

    <!-- ═══ REQ 1: Customer transcription buttons ═══════════════════════════════════════════
         Hidden from the Customer section UI. Customer transcription is now
         started and stopped automatically by the Agent Start/Stop buttons.
         These elements are kept here so all JS getElementById() calls succeed.
    ════════════════════════════════════════════════════════════════════════════ -->
    <button id="customerStartTranscriptionButton" title="Start Transcription" disabled>
      <i class="bi bi-caret-right-fill"></i> Start
    </button>
    <button id="customerLoadingTranscriptionButton" title="Starting Transcription" disabled style="display:none">
      <span class="btn-spinner"></span> Starting...
    </button>
    <button id="customerStopTranscriptionButton" title="Stop Transcription" disabled style="display:none">
      <i class="bi bi-stop-fill"></i>Stop
    </button>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <script type="module" src="./main.js"></script>

  <!-- Panel settings popups, customer-information scroll arrows and the profile tray: public/ui-controls.js.
       An external file, so the Content Security Policy can forbid inline scripts. -->
  <script src="./ui-controls.js"></script>


</body>

</html>

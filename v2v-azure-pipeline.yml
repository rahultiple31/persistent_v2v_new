trigger: none
pr: none

parameters:
  - name: targetEnvironment
    displayName: Target environment
    type: string
    default: v2v
    values:
      - v2v

  - name: targetModule
    displayName: Target module (deploys its complete group)
    type: string
    default: connect
    values:
      # Separate Plan/Apply stages deploy one complete group per run.
      # Deployment groups
      - connect
      - lambda
      - v2v
      - dynamodb
      - btsgsd-intent-kb

      # Connect and AI modules
      - connect_us_east_1
      - btsgsd-Main-IB-Flow
      - connect_views
      - abbvie_views
      - connect_queue
      - support_agent_tools
      - btsgsd_support_agent
      - btsgsd_ai_survey_agent
      - survey_ai_prompt
      - connect_ai_agent
      - agentcore_gateway
      - connect_Integrations

      # Lambda modules
      - lambda_us_east_1
      - lambda-ctr-survey
      - lambda-connect-daily-ctr-export
      - lambda-ctr-raw
      - lambda-snow-btsgsd-dev
      - lambda-servicenow-interaction
      - lambda-nextthink-handoff
      - UpdateSessionAttributes-dev
      - silence_guard-dev
      - conversion_of_queue_metrics
      - lex_queueflow_callback
      - lex_yesno

      # IAM, storage, secrets, and logging
      - iam-ctr
      - s3_connect_reporting
      - s3_intent_kb
      - secrets_manager
      - queue_info_dynamodb
      - cloudwatch_log_group

      # Lex modules
      - lex_bot
      - lex_yesno_bot
      - lex_customer_queue_flow_bot
      - lex_aiagent_survey_bot

      # V2V application modules
      - s3_v2v
      - cloudfront_v2v
      - cognito_v2v
      - iam_v2v
      - ssm_v2v

  - name: terraformAction
    displayName: Terraform action
    type: string
    default: plan
    values:
      - plan
      - apply

  - name: terraformSecureFile
    displayName: Authorized V2V Secure File name or GUID
    type: string
    default: v2v-terraform.tfvars


variables:
  terraformVersion: '1.10.5'
  deploymentRegion: 'us-east-1'
  workingDirectory: 'environments/${{ parameters.targetEnvironment }}'
  backendBucket: 'bts-cloud-terraform-tfstate'
  backendRegion: 'us-east-1'

# Dependencies in other Terraform states must already exist.
# Apply uses the saved plan; it does not create another plan.
stages:
  - stage: Plan
    displayName: Terraform Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

    jobs:
      - job: terraform_plan
        displayName: Plan ${{ parameters.targetModule }}

        pool:
          vmImage: ubuntu-latest

        steps:
          - template: templates/v2v-terraform-steps.yml
            parameters:
              action: plan
              targetModule: ${{ parameters.targetModule }}
              targetEnvironment: ${{ parameters.targetEnvironment }}
              terraformSecureFile: ${{ parameters.terraformSecureFile }}

          - task: PublishPipelineArtifact@1
            displayName: Publish saved Terraform plan
            inputs:
              targetPath: '$(Pipeline.Workspace)/v2v-plan'
              artifact: v2v-terraform-plan

  - stage: Apply
    displayName: Terraform Apply
    dependsOn: Plan
    condition: |
      and(
        succeeded(),
        eq('${{ parameters.terraformAction }}', 'apply')
      )

    jobs:
      - job: terraform_apply
        displayName: Apply ${{ parameters.targetModule }}

        pool:
          vmImage: ubuntu-latest

        steps:
          - task: DownloadPipelineArtifact@2
            displayName: Download saved Terraform plan
            inputs:
              buildType: current
              artifactName: v2v-terraform-plan
              targetPath: '$(Pipeline.Workspace)/v2v-plan'

          - template: templates/v2v-terraform-steps.yml
            parameters:
              action: apply
              targetModule: ${{ parameters.targetModule }}
              targetEnvironment: ${{ parameters.targetEnvironment }}
              terraformSecureFile: ${{ parameters.terraformSecureFile }}

trigger: none
pr: none

parameters:
  - name: targetEnvironment
    displayName: Target environment
    type: string
    default: v2v
    values:
      - v2v

  - name: targetModule
    displayName: Target module (deploys its complete group)
    type: string
    default: connect
    values:
      - all

      # Deployment groups
      - connect
      - lambda
      - v2v
      - dynamodb
      - btsgsd-intent-kb

      # Connect and AI modules
      - connect_us_east_1
      - btsgsd-Main-IB-Flow
      - connect_views
      - abbvie_views
      - connect_queue
      - support_agent_tools
      - btsgsd_support_agent
      - btsgsd_ai_survey_agent
      - survey_ai_prompt
      - connect_ai_agent
      - agentcore_gateway
      - connect_Integrations

      # Lambda modules
      - lambda_us_east_1
      - lambda-ctr-survey
      - lambda-connect-daily-ctr-export
      - lambda-ctr-raw
      - lambda-snow-btsgsd-dev
      - lambda-servicenow-interaction
      - lambda-nextthink-handoff
      - UpdateSessionAttributes-dev
      - silence_guard-dev
      - conversion_of_queue_metrics
      - lex_queueflow_callback
      - lex_yesno

      # IAM, storage, secrets, and logging
      - iam-ctr
      - s3_connect_reporting
      - s3_intent_kb
      - secrets_manager
      - queue_info_dynamodb
      - cloudwatch_log_group

      # Lex modules
      - lex_bot
      - lex_yesno_bot
      - lex_customer_queue_flow_bot
      - lex_aiagent_survey_bot

      # V2V application modules
      - s3_v2v
      - cloudfront_v2v
      - cognito_v2v
      - iam_v2v
      - ssm_v2v

  - name: terraformAction
    displayName: Terraform action
    type: string
    default: plan
    values:
      - plan
      - apply


variables:
  terraformVersion: '1.10.5'
  deploymentRegion: 'us-east-1'
  workingDirectory: 'environments/${{ parameters.targetEnvironment }}'
  backendBucket: 'bts-cloud-terraform-tfstate'
  backendRegion: 'us-east-1'

stages:
  - stage: deploy
    displayName: Terraform ${{ parameters.terraformAction }}
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')

    jobs:
      - job: terraform_deploy
        displayName: Deploy ${{ parameters.targetModule }}

        pool:
          vmImage: ubuntu-latest

        steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: $(terraformVersion)

          - bash: |
              set -euo pipefail
              umask 077

              case "$TF_ACTION" in plan|apply) ;; *) echo "Unsupported action" >&2; exit 1 ;; esac
              [[ "$AWS_V2V_OIDC_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]] || {
                echo "Configure AWS_V2V_OIDC_ROLE_ARN with the dedicated V2V role ARN." >&2
                exit 1
              }
              command -v aws >/dev/null
              command -v python3 >/dev/null

              if [ "$TARGET_MODULE" = all ]; then
                targets=(
                  secrets_manager
                  s3_connect_reporting
                  btsgsd-intent-kb
                  dynamodb
                  lambda
                  lambda-ctr-survey
                  lambda-connect-daily-ctr-export
                  lambda-ctr-raw
                  lambda-snow-btsgsd-dev
                  lambda-servicenow-interaction
                  lambda-nextthink-handoff
                  iam-ctr
                  cloudwatch_log_group
                  lex_bot
                  connect
                  v2v
                )
              else
                targets=("$TARGET_MODULE")
              fi

              export AWS_REGION="$DEPLOYMENT_REGION"
              export AWS_DEFAULT_REGION="$DEPLOYMENT_REGION"
              export AWS_PAGER="" AWS_CLI_AUTO_PROMPT=off TF_IN_AUTOMATION=true
              export TF_PLUGIN_CACHE_DIR="$AGENT_TEMPDIRECTORY/v2v-terraform-providers"
              mkdir -p "$TF_PLUGIN_CACHE_DIR"

              token_file="$AGENT_TEMPDIRECTORY/aws-oidc-token-v2v"
              trap 'rm -f -- "$token_file"' EXIT

              refresh_v2v_credentials() {
                local url response credentials account
                url="$(python3 -c '
              import os
              from urllib.parse import urlsplit, urlunsplit, parse_qsl, urlencode
              parts = urlsplit(os.environ["SYSTEM_OIDCREQUESTURI"])
              query = dict(parse_qsl(parts.query, keep_blank_values=True))
              query["api-version"] = "7.1-preview.1"
              print(urlunsplit(parts._replace(query=urlencode(query))))
              ')"
                response="$(curl --fail-with-body -sS -X POST \
                  -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" \
                  -H 'Content-Length: 0' "$url")"
                printf '%s' "$response" |
                  python3 -c 'import json,sys; print(json.load(sys.stdin)["oidcToken"], end="")' > "$token_file"
                chmod 600 "$token_file"

                credentials="$(aws sts assume-role-with-web-identity \
                  --no-sign-request \
                  --role-arn "$AWS_V2V_OIDC_ROLE_ARN" \
                  --role-session-name "azure-v2v-$BUILD_BUILDID" \
                  --web-identity-token "file://$token_file" \
                  --duration-seconds 3600 \
                  --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
                  --output text)"
                IFS=$'\t' read -r AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN <<< "$credentials"
                export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
                account="$(aws sts get-caller-identity --query Account --output text)"
                [ "$account" = "$EXPECTED_ACCOUNT_ID" ] || {
                  echo "Unexpected AWS account: $account" >&2
                  return 1
                }
              }

              gateway_id() {
                terraform output -json |
                  python3 -c 'import json,sys; o=json.load(sys.stdin); print(((o.get("agentcore_gateway") or {}).get("value") or {}).get("id") or "")'
              }

              for target in "${targets[@]}"; do
                source "$BUILD_SOURCESDIRECTORY/scripts/terraform-target-v2v.sh" \
                  "$target" "$TARGET_ENVIRONMENT" "$DEPLOYMENT_REGION"

                export TF_DATA_DIR="$AGENT_TEMPDIRECTORY/v2v-tf-data/$TERRAFORM_STATE_MODULE"
                mkdir -p "$TF_DATA_DIR"
                plan_file="$TF_DATA_DIR/tfplan"
                echo "Action: $TF_ACTION; group: $TERRAFORM_STATE_MODULE"
                echo "State: $TERRAFORM_BACKEND_KEY"

                refresh_v2v_credentials
                terraform init -input=false -reconfigure \
                  -backend-config="bucket=$BACKEND_BUCKET" \
                  -backend-config="key=$TERRAFORM_BACKEND_KEY" \
                  -backend-config="region=$BACKEND_REGION" \
                  -backend-config=encrypt=true
                terraform validate

                gateway_before=""
                if [ "$TERRAFORM_STATE_MODULE" = connect ]; then
                  gateway_before="$(gateway_id)"
                fi
                preserve_v2v_target_outputs

                refresh_v2v_credentials
                terraform plan -input=false "${TERRAFORM_PLAN_ARGS[@]}" -out="$plan_file"
                validate_v2v_target_plan "$plan_file"

                if [ "$TF_ACTION" = apply ]; then
                  refresh_v2v_credentials
                  terraform apply -input=false "$plan_file"

                  # Complete the first-time gateway audience configuration after its ID exists.
                  if [ "$TERRAFORM_STATE_MODULE" = connect ]; then
                    gateway_after="$(gateway_id)"
                    if [ -n "$gateway_after" ] && [ "$gateway_after" != "$gateway_before" ]; then
                      preserve_v2v_target_outputs
                      refresh_v2v_credentials
                      terraform plan -input=false "${TERRAFORM_PLAN_ARGS[@]}" -out="$plan_file"
                      validate_v2v_target_plan "$plan_file"
                      refresh_v2v_credentials
                      terraform apply -input=false "$plan_file"
                    fi
                  fi
                fi
              done
            displayName: Terraform plan or apply V2V groups
            workingDirectory: $(workingDirectory)
            env:
              TARGET_MODULE: ${{ parameters.targetModule }}
              TARGET_ENVIRONMENT: ${{ parameters.targetEnvironment }}
              TF_ACTION: ${{ parameters.terraformAction }}
              DEPLOYMENT_REGION: $(deploymentRegion)
              BACKEND_BUCKET: $(backendBucket)
              BACKEND_REGION: $(backendRegion)
              EXPECTED_ACCOUNT_ID: '518902362956'
              AWS_V2V_OIDC_ROLE_ARN: $(AWS_V2V_OIDC_ROLE_ARN)
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
